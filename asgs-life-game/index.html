<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>ASGS 고교 3년</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 구성: 위에는 칠판(상태판), 아래에는 시험지 한 장. 선택지는 객관식 보기 ①②③, 결과는 빨간펜으로 표시한다. */
:root{
  --paper:#EDF1EA; --grid:#DFE6DD; --sheet:#FFFFFF; --ink:#1C2826; --muted:#586964; --line:#C9D4CC;
  --board:#1F4338; --board-hi:#2F5A4C; --chalk:#F2F5EB; --chalk-dim:#A9C0B3; --wood:#9B6B3D;
  --hl:#FFE169; --hl-ink:#33290A; --red:#C93A20; --good:#1B7548;
  --av-bg:#D7E5DC; --id1:#BFDCF2; --id2:#EAF4FB; --sticker:#FFFFFF; --shade:rgba(10,20,16,.3);
  --f-display:'Gowun Batang','AppleMyungjo','Batang',serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[class*="bb-"],.qn,.circ,.stamp,.hud-id b,.cn,.tl,.big,.diploma h1,.modal-hd h2,.hall-t,.pole b,.how li::before,.seal{font-weight:700!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  -webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
i{font-style:normal}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted);font-size:14px}
.up{color:var(--good)} .dn{color:var(--red)}

/* 칠판 */
.bb{background:var(--board);color:var(--chalk);border:8px solid var(--wood);border-radius:4px;padding:22px 20px 26px;display:flex;flex-direction:column;gap:14px}
.bb-date{font-family:var(--f-display);font-size:18px;color:var(--chalk-dim);align-self:flex-end}
.bb-title{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,14vw,76px);line-height:1.05;text-wrap:balance}
.bb-title span{color:var(--hl)}
.bb-sub{font-family:var(--f-display);font-size:22px;line-height:1.4;color:var(--chalk)}
.bb-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:block;width:100%;border:0;border-radius:3px;background:var(--ink);color:var(--sheet);padding:14px 16px;font-weight:700;font-size:16px;text-align:center}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.chalk{background:var(--hl);color:var(--hl-ink);width:auto;flex:1 1 150px}
.btn.ghost{background:transparent;color:var(--chalk);border:2px dashed var(--chalk-dim);width:auto;flex:1 1 150px}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.textbtn{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:center;padding:8px}

/* 시험지 */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line),3px 4px 0 var(--grid)}
.shd{display:flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:2px}
.shd-m{flex:none;padding:6px 10px;border-right:1.5px solid var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.shd h2{flex:1;min-width:0;padding:6px 10px;font-size:17px;font-weight:700;display:flex;align-items:center}
.lead{font-size:16px}
.q{font-size:16px;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.q .qn{font-family:var(--f-display);font-size:22px;line-height:1}
.q em{font-style:normal;font-size:13px;font-weight:500;color:var(--muted)}
.note{font-size:14px;border:1px dashed var(--line);border-radius:3px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.note b{font-weight:700}
.note.warn{border-color:var(--red);color:var(--red)}
.h3{font-size:15px;font-weight:700;border-bottom:1.5px solid var(--ink);padding-bottom:4px}

/* 계획 */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{border:1.5px dashed var(--line);border-radius:3px;padding:6px 4px;font-size:13px;text-align:center;color:var(--muted);min-height:34px;display:flex;align-items:center;justify-content:center}
.slot.on{border-style:solid;border-color:var(--hl-ink);background:var(--hl);color:var(--hl-ink);font-weight:700}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;align-items:start;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:3px;padding:9px 9px 8px}
.actc .ic{grid-row:span 3;font-size:22px;line-height:1.2}
.actc .an{font-weight:700;font-size:15px;line-height:1.3}
.actc .ad{font-size:12px;color:var(--muted);line-height:1.35}
.actc .af{font-size:11.5px;line-height:1.5;margin-top:3px;display:flex;flex-wrap:wrap;gap:0 6px}
.actc.on{background:var(--hl);border-color:var(--hl-ink);color:var(--hl-ink)}
.actc.on .ad,.actc.on .af i{color:var(--hl-ink)}
.actc:disabled{opacity:.45;cursor:not-allowed}

/* 보기 */
.opts{display:flex;flex-direction:column;border-top:1px dashed var(--line)}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:12px 4px;font-size:15.5px;line-height:1.5}
.opt .on{font-size:19px;line-height:1.25}
.opt .ot{background:linear-gradient(transparent 62%,var(--hl) 62%) no-repeat;background-size:0 100%;transition:background-size .18s}
.opt:hover .ot,.opt:focus-visible .ot{background-size:100% 100%}
.tag{font-style:normal;font-size:11.5px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:2px;padding:0 5px;margin-left:4px;white-space:nowrap}

/* 결과 */
.dl{display:inline-flex;flex-wrap:wrap;gap:5px}
.d{font-size:12.5px;font-weight:700;padding:1px 8px;border:1px solid currentColor;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.done{font-size:14px;display:flex;flex-direction:column;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.done b{font-weight:700}
.res{display:flex;flex-direction:column;gap:6px}
.res-q{font-size:13px;color:var(--muted)}
.res-t{font-size:16px}
.prevres{font-size:14.5px;border-left:3px solid var(--red);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.exam{border:1.5px solid var(--ink);border-radius:2px;padding:12px;display:flex;flex-direction:column;gap:8px}
.exam h4{font-size:15px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.exam h4 small{font-size:12px;font-weight:500;color:var(--muted)}
.gt{width:100%;border-collapse:collapse;font-size:14.5px}
.gt th{text-align:left;font-weight:500;padding:4px 0;border-bottom:1px dotted var(--line)}
.gt td{text-align:right;padding:4px 0;border-bottom:1px dotted var(--line);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.gt small,.gc small{font-size:11px;font-weight:500;color:var(--muted);margin-left:1px}
.gcells{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gc{border:1px solid var(--line);border-radius:2px;padding:6px 4px;text-align:center;font-size:12.5px;display:flex;flex-direction:column}
.gc b{font-size:19px;font-variant-numeric:tabular-nums}
.avg{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.circ{display:inline-block;font-family:var(--f-display);font-size:26px;line-height:1;color:var(--red);border:2.5px solid var(--red);border-radius:50%;padding:5px 12px 3px;transform:rotate(-6deg);margin:0 2px}
.avg span{font-size:13px;font-weight:700}
.stamp{align-self:flex-start;font-family:var(--f-display);font-size:26px;line-height:1;font-weight:700;border:3px solid currentColor;border-radius:4px;padding:6px 12px 3px;transform:rotate(-4deg)}
.stamp.ok{color:var(--red)} .stamp.no{color:var(--muted)}
.recnew{font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.recnew li{padding-left:14px;position:relative}
.recnew li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:2px;background:var(--red)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv div{border:1px solid var(--line);border-radius:2px;padding:8px 6px;text-align:center}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.apps{display:flex;flex-direction:column}
.apps li{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:space-between;align-items:baseline;padding:7px 2px;border-bottom:1px dotted var(--line);font-size:14.5px}
.apps li b{font-weight:700}
.apps li.ok b{color:var(--red)}
.apps li.no b{color:var(--muted);font-weight:500}
.apps small{flex-basis:100%;font-size:12px;color:var(--muted)}

/* 그림 */
.scene{display:block}
.scn{position:relative;margin:-18px -16px 0;aspect-ratio:20/9;overflow:hidden;border-radius:2px 2px 0 0;background:var(--grid)}
.scn.solo{margin:0;border:1px solid var(--line);border-radius:3px}
.hall-t{position:absolute;left:9.3%;width:49%;top:5.5%;height:19%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:clamp(18px,6.4vw,34px);color:#3A2320;white-space:nowrap}
.scn .scene,.kvis .scene{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover}
.who{position:absolute;aspect-ratio:240/300;width:auto;filter:drop-shadow(1.5px 0 0 var(--sticker)) drop-shadow(-1.5px 0 0 var(--sticker)) drop-shadow(0 -1.5px 0 var(--sticker)) drop-shadow(0 4px 6px var(--shade))}
.scn .who{right:4%;bottom:-10%;height:106%}
.hero{display:flex;flex-direction:column}
.kvis{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:4px 4px 0 0;margin-bottom:-10px;background:var(--grid)}
.kvis .who{bottom:-3%;height:80%}
.kvis .who.l{left:5%} .kvis .who.r{right:5%}
.hero .bb{position:relative}
.idp{display:block;width:100%;max-width:132px;aspect-ratio:1/1.12;overflow:hidden;border:1px solid var(--line);border-radius:3px;background:linear-gradient(var(--id1),var(--id2))}
.idp svg,.idp .ph{display:block;width:100%;height:auto;margin-top:6%}
.ph{display:block;max-width:none}
.phf{display:block;overflow:hidden;border-radius:50%}
.phf img{display:block;width:100%;max-width:none;transform:scale(2.3);transform-origin:50% 33%}

/* 직업 카드 */
.jnew{display:flex;flex-direction:column;gap:6px}
.jcard{display:flex;flex-direction:column;gap:2px;border:1.5px solid var(--ink);border-radius:3px;padding:9px 11px;background:var(--sheet);font-size:13.5px;line-height:1.5}
.jcard .jf{font-size:11.5px;font-weight:700;color:var(--red)}
.jcard b{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.3}
.jcard small{font-size:12px;color:var(--muted)}
.jbook{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.jrow{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:6px;align-items:start}
.jrow>span{color:var(--muted);padding-top:3px}
.jrow>div{display:flex;flex-wrap:wrap;gap:4px}
.jrow i{border:1px dashed var(--line);border-radius:2px;padding:1px 6px;color:var(--muted);min-width:2.2em;text-align:center}
.jrow i.on{border-style:solid;border-color:var(--ink);color:var(--ink);font-weight:700}
.jlist{display:flex;flex-direction:column;font-size:13.5px;margin-top:8px}
.jlist li{padding:6px 0;border-bottom:1px dotted var(--line)}
.jlist b{font-weight:700}
.jlist small{display:block;font-size:12px;color:var(--muted)}

/* 상태판 */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);color:var(--chalk);border-bottom:6px solid var(--wood)}
.hud-in{max-width:560px;margin:0 auto;padding-block:9px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.hud-top{display:flex;align-items:center;gap:10px}
.hud-av{flex:none;display:flex;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--av-bg)}
.hud-id{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.hud-id b{font-family:var(--f-display);font-size:21px;font-weight:700}
.hud-id span{font-size:12.5px;color:var(--chalk-dim)}
.hud-btn{flex:none;display:flex;gap:6px}
.hud-btn button{background:none;border:1.5px solid var(--chalk-dim);border-radius:3px;color:var(--chalk);font-size:13px;padding:5px 9px}
.ticks{display:flex;gap:2px}
.ticks i{flex:1;height:5px;background:var(--board-hi)}
.ticks i.pd{background:var(--chalk-dim)}
.ticks i.cu{background:var(--hl)}
.ticks i.ys{margin-left:6px}
.gauges{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.gg{display:flex;flex-direction:column;gap:1px;min-width:0}
.gg.sep{border-left:1px dashed var(--board-hi);padding-left:6px}
.gg span{font-size:11.5px;color:var(--chalk-dim);line-height:1.2}
.gg b{font-size:16px;line-height:1.2;font-variant-numeric:tabular-nums}
.gg .bar{height:4px;background:var(--board-hi);display:block}
.gg .bar i{display:block;height:100%;background:var(--chalk);transition:width .5s}
.gg.low b{color:#FF9B85} .gg.low .bar i{background:#FF9B85}
.gg.chg b{animation:flash 1s}
@keyframes flash{0%,40%{color:var(--hl)}}

/* 캐릭터 */
.chars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.charc{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--sheet);border:2px solid var(--line);border-radius:3px;padding:14px 10px}
.charc.on{border-color:var(--ink);box-shadow:inset 0 -8px 0 var(--hl)}
.charc .cl{font-size:12px;color:var(--muted)}
.charc .cn{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.axes{display:flex;flex-direction:column;gap:10px}
.axis{display:flex;flex-direction:column;gap:4px}
.axis>span{font-size:13px;font-weight:700;color:var(--muted)}
.poles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pole{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 9px;align-items:center;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-radius:3px;padding:8px 9px}
.pole b{grid-row:span 2;font-family:var(--f-display);font-size:34px;line-height:1;min-width:.7em;text-align:center}
.pole .pn{font-size:14px;font-weight:700;line-height:1.3}
.pole .pd{font-size:12px;color:var(--muted);line-height:1.35}
.pole.on{background:var(--hl);border-color:var(--hl-ink);color:var(--hl-ink)}
.pole.on .pd{color:var(--hl-ink)}
.typec{border:1.5px solid var(--ink);border-radius:2px;padding:12px;display:flex;flex-direction:column;gap:5px;font-size:14.5px}
.typec .tl{font-family:var(--f-display);font-size:42px;font-weight:700;line-height:1;letter-spacing:.08em}
.typec .tn{font-weight:700;font-size:16px}
.typec ul{font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.typec li{padding-left:14px;position:relative}
.typec li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:2px;background:var(--red)}
.fit{display:table;font-style:normal;font-size:10.5px;font-weight:700;line-height:1.5;color:var(--good);border:1px solid currentColor;border-radius:2px;padding:0 4px;margin:2px 0 1px;white-space:nowrap}
.actc.on .fit{color:var(--hl-ink)}
.ibars li{grid-template-columns:6.4em minmax(0,1fr)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.field input{font:inherit;font-weight:400;font-size:16px;color:var(--ink);background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:10px 12px;width:100%}
.how{display:flex;flex-direction:column;gap:8px;counter-reset:how}
.how li{counter-increment:how;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:15px}
.how li::before{content:counter(how);font-family:var(--f-display);font-size:24px;line-height:1.1;font-weight:700;color:var(--red)}
.how b{font-weight:700}

/* 모달 */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,20,16,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--sheet);color:var(--ink);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:6px 6px 0 0;border-top:6px solid var(--wood);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.modal-hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-hd h2{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.modal-hd button{background:none;border:1.5px solid var(--ink);border-radius:3px;padding:4px 12px;font-size:14px}
.rows{display:flex;flex-direction:column;font-size:14.5px}
.rows li{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px dotted var(--line)}
.rows li span:first-child{color:var(--muted);font-size:13px}
.glist{display:flex;flex-direction:column;font-size:14px}
.glist li{padding:7px 0;border-bottom:1px dotted var(--line);display:flex;flex-direction:column}
.glist li b{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.glist li small{font-size:12.5px;color:var(--muted)}

/* 졸업 */
.diploma{background:var(--sheet);border:3px double var(--ink);border-radius:2px;padding:26px 18px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.diploma h1{font-family:var(--f-display);font-size:46px;font-weight:700;letter-spacing:.3em;margin-right:-.3em;line-height:1.1}
.diploma .dn-name{font-size:20px;font-weight:700}
.diploma p{font-size:15px;max-width:22em}
.diploma .seal{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1;color:var(--red);border:2.5px solid var(--red);border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;transform:rotate(-10deg);margin-top:2px}
.big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.2;text-wrap:balance}
.big-s{font-size:14.5px;color:var(--muted)}
.statrows{display:flex;flex-direction:column;gap:7px}
.statrows li{display:grid;grid-template-columns:2.6em minmax(0,1fr) 5.4em;gap:8px;align-items:center;font-size:14px}
.statrows .bar{height:8px;background:var(--grid);position:relative;display:block}
.statrows .bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.statrows .bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red)}

function add(t,d){for(const k in d)t[k]=(t[k]||0)+d[k];return t;}
function apply(fx,o){
  o=o||{};const out={};
  for(const k in fx){
    if(!(k in S.stats))continue;
    let d=fx[k];
    if(d>0&&GROW.includes(k)&&!o.raw){const base=d;d*=(1-S.stats[k]/110);if(o.tired&&k!=='rel')d*=0.6;d=Math.round(d);if(base>=4)d=Math.max(1,d);}
    const b=S.stats[k];S.stats[k]=clamp(Math.round(b+d),0,100);
    if(S.stats[k]!==b)out[k]=S.stats[k]-b;
  }
  return out;
}
function rec(cat,text){const r={y:year(),cat,text};S.recs.push(r);S.newRecs.push(r);}
function checkBurn(){if(S.stats.hp<=0||S.stats.mind<=0)S.burn=true;}

    int:{hum:0,sci:0,med:0,biz:0,edu:0,art:0},club:null,goal:null,path:null,major:null,job:null,track:null,strat:null,jstrat:null,
    elect:{2:null,3:null},el3:null,y3subs:null,exams:[],mocks:[],csat:null,cert:0,recs:[],newRecs:[],cnt:{},flags:{},
    picks:[],planFx:null,planNames:[],tired:false,hap:null,log:[],res:null,burn:false,burns:0,fin:null,fp:0};

function startTurn(){
  S.picks=[];S.planFx=null;S.planNames=[];S.log=[];S.res=null;S.step=0;S.hap=null;S.newRecs=[];S.tired=false;S.mbGain=0;S.newJobs=[];S.rev=null;
  if(cal().fin){runFinal();return;}
  if(S.t>0&&!S.burn&&Math.random()<0.35){const h=HAPS[Math.floor(Math.random()*HAPS.length)];S.hap={t:h.t,fx:apply(h.fx,{raw:true})};}
  if(S.t>0&&!S.burn)pickRev();
  S.phase=S.burn?'burn':'plan';
}
function runPlan(){
  const c=ctx(),tired=S.stats.hp<30||S.stats.mind<30,tot={};
  S.picks.forEach(id=>{
    const a=ACT[id];add(tot,apply(a.fx,{tired}));S.cnt[id]=(S.cnt[id]||0)+1;
    if(id==='club'&&S.club)S.int[S.club]+=1;
    if(id==='career'||id==='camp'||id==='read')S.int[aim()]+=id==='read'?0.5:1;
  });
  S.picks.forEach(id=>{if(id==='career'||id==='camp'||(id==='read'&&Math.random()<.5))unlockJob(jobField(),'plan');});
  const drift=c.vac?{hp:4,mind:3,ns:-1,sn:-1,rel:-1}:{hp:-2,mind:c.y===3?-5:-4,ns:-2,sn:-2,rel:-1};
  if(c.job3){delete drift.ns;delete drift.sn;}
  add(tot,apply(drift,{raw:true}));
  const mb=mbBonus();S.mbGain=mb.b+mb.jp;if(S.mbGain)add(tot,apply({mind:S.mbGain},{raw:true}));
  S.fitN+=mb.hits;S.pickN+=S.picks.length;S.lastPicks=S.picks.slice();
  S.planFx=tot;S.tired=tired;S.planNames=S.picks.map(id=>ACT[id].n);
  S.phase='event';S.step=0;checkBurn();
}
function fitLetters(id){return S.mb.split('').filter(L=>POLE[L].acts&&POLE[L].acts.includes(id));}
function mbBonus(){
  let b=0,hits=0;
  S.picks.forEach(id=>{const n=fitLetters(id).length;b+=n;if(n)hits++;});
  let jp=0;
  if(S.lastPicks&&S.lastPicks.length){const r=S.picks.filter(id=>S.lastPicks.includes(id)).length;
    if(S.mb.includes('J')&&r>=2)jp=2;if(S.mb.includes('P')&&S.picks.length-r>=2)jp=2;}
  return{b,jp,hits};
}
function intBars(){
  const mx=Math.max(1,...FKEYS.map(k=>S.int[k]));
  return'<ul class="statrows ibars">'+FKEYS.slice().sort((a,b)=>S.int[b]-S.int[a]).map(k=>'<li><span>'+F[k].n+'</span><i class="bar"><i style="width:'+Math.round(S.int[k]/mx*100)+'%"></i></i></li>').join('')+'</ul>';
}
function runBurn(){
  S.planFx=apply({hp:35,mind:35,ns:-3,sn:-3},{raw:true});S.planNames=['한 달 쉬어 가기'];
  S.burn=false;S.burns++;S.phase='event';S.step=0;
}

const g5=p=>p>=84?1:p>=66?2:p>=46?3:p>=28?4:5;
function g9(p){const th=[90,80,70,58,46,35,25,15];for(let i=0;i<8;i++)if(p>=th[i])return i+1;return 9;}
const condB=()=>(S.stats.hp-50)*0.1+(S.stats.mind-50)*0.1;
function schoolSubs(){
  const y=year();
  if(y===1)return['공통국어','공통수학','공통영어','통합사회','통합과학'];
  if(y===2)return['문학','대수','영어Ⅰ'].concat(F[S.elect[2]||aim()].y2);
  return['독서와 작문','미적분Ⅰ','영어Ⅱ'].concat(S.y3subs||F[aim()].y3);
}
function elecAff(){
  const y=year();
  if(y===2)return S.elect[2]===aim()?4:0;
  if(y===3)return S.el3==='fit'?-3:S.el3==='easy'?5:0;
  return 0;
}
function runExam(ex){
  const type=ex[0],title=ex[1],y=year();
  if(type==='school'){
    const base=S.stats.ns+condB()+rnd(-4,4);
    const subs=schoolSubs().map((n,i)=>({n,g:g5(base+rnd(-7,7)+(i>=3?elecAff():0))}));
    const e={kind:'school',y,title,subs,avg:mean(subs.map(s=>s.g)),prev:S.exams.length?S.exams[S.exams.length-1].avg:null};
    S.exams.push(e);return e;
  }
  if(type==='mock'||type==='csat'){
    const base=S.stats.sn+condB()*(type==='csat'?1.5:1)+rnd(-4,4);
    const subs=['국어','수학','영어','탐구'].map(n=>({n,g:g9(base+rnd(-7,7))}));
    const e={kind:type,y,title,subs,avg:mean(subs.map(s=>s.g)),prev:S.mocks.length?S.mocks[S.mocks.length-1].avg:null};
    if(type==='csat')S.csat=e;else S.mocks.push(e);return e;
  }
  const sk=S.stats.skill+rnd(-6,6),c=S.job.c;
  if(type==='certW'){
    const ok=sk>=28;if(ok)S.cert=1;
    return{kind:'cert',title:c+' 필기시험',ok,msg:ok?'필기에 합격했다. 실기시험 응시 자격을 얻었다.':'필기에서 떨어졌다. 다음 회차에 다시 응시한다.'};
  }
  if(type==='certP'){
    if(S.cert===1){const ok=sk>=48;if(ok){S.cert=2;rec('진로활동','자격증 취득: '+c);}
      return{kind:'cert',title:c+' 실기시험',ok,msg:ok?'실기까지 합격했다. 자격증을 손에 쥐었다.':'시간 안에 과제를 끝내지 못했다. 가을 시험에 다시 도전한다.'};}
    const ok=sk>=30;if(ok)S.cert=1;
    return{kind:'cert',title:c+' 필기시험 재응시',ok,msg:ok?'두 번째 필기에서 합격했다. 실기는 가을 시험으로 미뤘다.':'필기에서 다시 떨어졌다. 가을 시험을 준비한다.'};
  }
  if(type==='certF'){
    if(S.cert===2)return null;
    if(S.cert===1){const ok=sk>=50;if(ok){S.cert=2;rec('진로활동','자격증 취득: '+c);}
      return{kind:'cert',title:c+' 가을 실기시험',ok,msg:ok?'가을 실기시험에 합격했다. 지원서에 자격증을 적을 수 있다.':'이번에도 실기에서 떨어졌다. 자격증 없이 지원서를 낸다.'};}
    const ok=sk>=30;if(ok)S.cert=1;
    return{kind:'cert',title:c+' 가을 필기시험',ok,msg:ok?'필기에 합격했다. 실기는 졸업 전에 한 번 더 기회가 있다.':'필기를 통과하지 못했다. 자격증 없이 지원서를 낸다.'};
  }
  return null;
}
function fitScore(){
  const g=aim();let f=0;
  if(S.elect[2]===g)f+=25;
  if(S.el3==='fit')f+=25;
  if(S.club===g)f+=15;
  if(S.flags.topic)f+=15;
  if(S.flags.sawCollege||S.flags.sawJob)f+=10;
  return f+Math.min(10,S.int[g]);
}
function trackScores(){
  const na=S.exams.length?(5-mean(S.exams.map(e=>e.avg)))/4*100:50;
  const mk=S.csat?S.csat.avg:(S.mocks.length?S.mocks[S.mocks.length-1].avg:5);
  const su=(9-mk)/8*100,fit=fitScore();
  const iv=(S.flags.iv?5:0)+Math.min(4,(S.cnt.iv||0)*2)+(S.stats.rel-50)*0.04+(S.stats.mind-50)*0.04;
  return{na,su,mk,fit,jonghap:0.5*na+0.18*S.stats.act+0.1*S.stats.car+0.17*fit+iv,gyogwa:0.92*na+0.08*S.stats.act,jeongsi:su};
}

const LV=['상향','적정','안정'],THR={상향:76,적정:60,안정:44};

  if(key==='gyogwa'){const lim={상향:4.0,적정:5.0}[lv];if(lim&&csat>lim)return{lv,pass:false,why:'수능 최저학력기준을 맞추지 못했다'};}

function runFinal(){

    const s=S.stats,f=S.flags;

    const T={high:[78,60],fit:[68,54],safe:[999,46]}[S.jstrat||'fit'];

    S.fin={kind:'job',lv,pages:lv==='none'?['jobres','fallback','grad']:['jobres','contract','grad'],fb:null};

  let key=S.track||'jonghap';if(key==='jeongsi')key=sc.jonghap>=sc.gyogwa?'jonghap':'gyogwa';
  let susi=[],sb=null,jeongsi=[],jb=null;const pages=[];

    const mix={high:['상향','상향','상향','적정','적정','안정'],mid:['상향','상향','적정','적정','안정','안정'],safe:['상향','적정','적정','안정','안정','안정']}[S.strat];

const sceneCache={};
const SCENE_IMG={'gate:spring':'img/bg-gate-spring.webp','class:spring':'img/bg-class-spring.webp','class:summer':'img/bg-class-summer.webp','hall':'img/bg-hall.webp','work':'img/bg-work.webp','night':'img/bg-night.webp','counsel':'img/bg-counsel.webp','field':'img/bg-field.webp','festival':'img/bg-festival.webp','gate:summer':'img/bg-gate-summer.webp','gate:autumn':'img/bg-gate-autumn.webp','gate:winter':'img/bg-gate-winter.webp',
  'class:autumn':'img/bg-class-autumn.webp','class:winter':'img/bg-class-winter.webp'};
function sceneSvg(k){
  if(sceneCache[k])return sceneCache[k];
  const pp=k.split(':'),im=SCENE_IMG[pp.slice(0,2).join(':')]||SCENE_IMG[pp[0]];
  if(im)return sceneCache[k]='<img class="scene" src="'+im+'" alt="" decoding="async" draggable="false">'+(pp[0]==='hall'?'<span class="hall-t">'+pp[1]+'</span>':'');
  const p=k.split(':');let h;
  switch(p[0]){
    case'gate':h=sceneGate(p[1]);break;case'class':h=sceneClass(p[1],p[2]==='1');break;case'field':h=sceneField();break;
    case'festival':h=sceneFestival();break;case'counsel':h=sceneCounsel();break;case'night':h=sceneNight(p[1]==='1');break;
    case'hall':h=sceneHall(p[1]);break;default:h=sceneWork();
  }
  return sceneCache[k]=h;
}
function sceneKey(){
  const y=year(),s=slot();
  if(S.phase==='yearend')return'hall:'+y+'학년 종업식';
  if(S.phase==='final'){const p=S.fin.pages[S.fp];return p==='grad'?'hall:졸업식':(p==='jobres'||p==='contract')?'work':p==='fallback'?'counsel':'gate:winter';}
  if(y===3&&S.path==='job')return['work','work','work','work','gate:summer','counsel','counsel','hall:졸업식'][s];
  return{1:['gate:spring','class:spring:1','field','class:summer:1','gate:summer','class:autumn:1','festival','counsel'],
    2:['gate:spring','class:spring:1','class:summer:0','class:summer:1','gate:summer','counsel','class:winter:1','night:1'],
    3:['gate:spring','class:spring:1','class:summer:1','class:summer:1','night:0','gate:autumn','night:1','hall:졸업식']}[y][s];

function mood(){
  const s=S.stats;
  if(S.phase==='final'){const f=S.fin,p=f.pages[S.fp];
    if(p==='grad'||p==='contract')return'happy';if(p==='fallback')return'worry';
    if(p==='susi')return f.sb?'happy':'worry';if(p==='jeongsi')return f.jb?'happy':'worry';if(p==='jobres')return f.lv==='none'?'worry':'happy';}
  if(S.phase==='burn'||s.hp<30||s.mind<30)return'tired';
  if(S.phase==='yearend')return'happy';
  if(S.phase==='result'&&S.res){const e=S.res.exams;
    if(e.some(x=>x.kind==='cert'&&!x.ok))return'worry';
    if(e.some(x=>x.kind==='cert'&&x.ok))return'happy';
    const x=e.find(x=>x.kind!=='cert'&&x.prev!=null);
    if(x){const d=x.prev-x.avg;if(d>=0.3)return'happy';if(d<=-0.3)return'worry';}}
  return s.mind>=75?'happy':'smile';
}

    +'<section class="sheet"><h2 class="h3">성적 흐름 <span class="muted">(평균 등급)</span></h2>'
    +'<p class="muted">학교 시험, 5등급제</p><div class="flow">'+flowS+'</div>'
    +(flowM?'<p class="muted">모의고사와 수능, 9등급제</p><div class="flow">'+flowM+'</div>':'')+'</section>'
    +'<section class="sheet">'+jobsBook().replace('<h3 class="h3">','<h2 class="h3">').replace('</h3>','</h2>')+(S.jobs.length?'<ul class="jlist">'+S.jobs.map(n=>{const j=jobInfo(n);return'<li><b>'+n+'</b> '+j.d+' <small>'+j.s+'</small></li>';}).join('')+'</ul>':'')+'</section>'
    +'<section class="sheet"><h2 class="h3">친구들의 졸업</h2><ul class="frend">'+FKEYS2.map(k=>{const e=friendEnd(k),f=FRIENDS[k];return'<li>'+frFace(k,e.b>=5?'happy':'smile')+'<div><b>'+f.n+'</b> <small>'+f.role+' · 우정 '+'♥'.repeat(Math.max(0,Math.min(5,Math.ceil(e.b/1.5))))+'</small><p>'+e.line+'</p><p class="muted">'+e.fate+'</p></div></li>';}).join('')+'</ul></section>'
    +'<section class="sheet"><h2 class="h3">학생부에 남은 기록</h2><ul class="recnew" style="border:0;padding:0">'+recs+'</ul>'
    +'<p class="muted">동아리 활동 '+(S.cnt.club||0)+'번, 봉사 '+((S.cnt.vol||0)*4)+'시간, 독서 '+(S.cnt.read||0)+'권, 진로 탐색 '+((S.cnt.career||0)+(S.cnt.camp||0))+'번</p></section>'
    +'<section class="sheet"><h2 class="h3">돌아보기</h2><ol class="reflect">'
    +'<li>게임에서 고른 성향과 실제 나는 어떤 점이 같고 어떤 점이 다른가?</li>'
    +'<li>게임 속 흥미 1순위 분야와 내가 실제로 끌리는 분야는 같은가? 그 분야와 이어지는 선택과목은 무엇인가?</li>'
    +'<li>내가 고른 가치관은 실제로 직업을 고를 때도 가장 중요한 기준인가?</li>'
    +'<li>모은 직업 카드 가운데 더 알아보고 싶은 직업 하나를 골라, 그 직업을 가지려면 어떤 과목과 경험이 필요한지 찾아보자.</li>'
    +'<li>이번 학기에 실제로 해 볼 수 있는 활동 한 가지를 적어 보자.</li></ol></section>'
    +(UI.copy?'<section class="sheet"><p class="muted">'+(UI.copy==='ok'?'결과를 복사했다. 활동지나 설문에 붙여 넣으면 된다.':'자동 복사가 되지 않았다. 아래 글을 길게 눌러 복사한다.')+'</p><textarea class="copybox" id="copybox" readonly>'+esc(summaryText())+'</textarea></section>':'')
    +'<div class="btnrow"><button class="btn line" data-a="copy" data-k="copy">결과 요약 복사</button><button class="btn" data-a="again" data-k="again">다른 3년 살아 보기</button></div></main>';
}
function vModal(){
  let body='',title='';
  if(UI.modal==='rec'){
    title='학교생활기록부';const g=S.goal;
    const cats=['자율·자치활동','동아리활동','진로활동','교과 탐구'];
    body='<ul class="rows"><li><span>성향</span><span>'+S.mb+' · '+TYPE16[S.mb][0]+'</span></li><li><span>가치관</span><span>'+(S.value||'1학년 겨울방학 상담에서 정한다')+'</span></li><li><span>진로 희망</span><span>'+(g?F[g].n:'탐색 중')+(S.major?' · '+S.major:S.job?' · '+S.job.n+' 취업':'')+'</span></li>'
      +'<li><span>동아리</span><span>'+(S.club?F[S.club].club:'미정')+'</span></li>'
      +'<li><span>2학년 선택</span><span>'+(S.elect[2]?F[S.elect[2]].y2.join(', '):'1학년 2학기에 정한다')+'</span></li>'
      +'<li><span>3학년 선택</span><span>'+(S.y3subs?S.y3subs.join(', '):'2학년 1학기에 정한다')+'</span></li>'
      +(S.track?'<li><span>주력 전형</span><span>'+TRACKN[S.track]+'</span></li>':'')
      +(S.path==='job'&&S.job?'<li><span>자격증</span><span>'+S.job.c+' '+(S.cert===2?'취득':S.cert===1?'필기 합격':'준비 중')+'</span></li>':'')+'</ul>'
      +cats.map(c=>{const r=S.recs.filter(x=>x.cat===c);return'<h3 class="h3">'+c+'</h3><ul class="recnew" style="border:0;padding:0">'+(r.length?r.map(x=>'<li>'+x.y+'학년: '+x.text+'</li>').join(''):'<li class="muted">아직 기록이 없다.</li>')+'</ul>';}).join('')
      +jobsBook()
      +'<p class="muted">동아리 활동 '+(S.cnt.club||0)+'번, 봉사 '+((S.cnt.vol||0)*4)+'시간, 독서 '+(S.cnt.read||0)+'권, 수행평가·탐구 '+(S.cnt.report||0)+'번</p>';
  }else{
    title='성적표';
    const li=e=>'<li><b><span>'+e.y+'학년 '+e.title+'</span><span>평균 '+g1(e.avg)+'</span></b><small>'+e.subs.map(s=>s.n+' '+s.g).join(' · ')+'</small></li>';
    body='<h3 class="h3">학교 시험 (5등급제)</h3><ul class="glist">'+(S.exams.length?S.exams.map(li).join(''):'<li class="muted">아직 치른 시험이 없다.</li>')+'</ul>'
      +'<h3 class="h3">모의고사 (9등급제)</h3><ul class="glist">'+(S.mocks.length?S.mocks.concat(S.csat?[S.csat]:[]).map(li).join(''):'<li class="muted">아직 치른 시험이 없다.</li>')+'</ul>'
      +'<p class="muted">등급은 숫자가 작을수록 높다. 학교 시험 1등급은 상위 10%, 모의고사 1등급은 상위 4%다.</p>';
  }
  return'<div class="scrim" data-a="closemodal"><div class="modal" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="modal-hd"><h2>'+title+'</h2><button data-a="closemodal" data-k="m-close">닫기</button></div>'+body+'</div></div>';
}
function vGame(){
  switch(S.phase){
    case'plan':return vPlan();case'burn':return vBurn();case'event':return vEvent();case'result':return vResult();
    case'yearend':return vYearEnd();case'final':return vFinal();
  }
  return'';
}
const layerHtml={};
function setLayer(id,h){if(layerHtml[id]===h)return;layerHtml[id]=h;const el=document.getElementById(id);if(el)el.innerHTML=h;}
function layers(){
  if(UI.screen==='title'||!S||UI.screen==='char')return{bg:'gate:spring'};
  if(S.phase==='ending')return{bg:'hall:졸업식',actor:chara(S.ch,{ex:'happy'})};
  return{bg:sceneKey(),actor:chara(S.ch,{ex:mood()})};
}
function render(top){
  const app=document.getElementById('app'),ae=document.activeElement,fk=ae&&ae.dataset?ae.dataset.k:null;
  let h;
  if(UI.screen==='title'||!S&&UI.screen!=='char')h=vTitle();
  else if(UI.screen==='char')h=vChar();
  else if(S.phase==='ending')h=vEnding();
  else h=vHud()+'<main class="wrap game">'+vGame()+'</main>';
  if(UI.modal&&S&&UI.screen==='game')h+=vModal();
  app.innerHTML=h;
  const L=layers();setLayer('bg',L.bg?'<div class="stage">'+sceneSvg(L.bg)+'</div>':'');setLayer('actor',L.actor||'');
  prev=S?Object.assign({},S.stats):null;
  if(top)window.scrollTo(0,0);
  else if(fk){const el=app.querySelector('[data-k="'+fk+'"]');if(el&&!el.disabled)el.focus({preventScroll:true});}
}

/* ---------- 입력 ---------- */
const H={
  tochar(){UI.screen='char';render(true);},
  totitle(){UI.screen='title';UI.modal=null;render(true);},
  resume(){const sv=loadSave();if(sv){S=sv;UI.screen='game';prev=null;render(true);}},
  sel(v){UI.sel=v;render();},
  ax(v){const p=v.split(':');UI.mb[p[0]]=p[1];render();},
  start(){const mb=mbType();if(!mb)return;const el=document.getElementById('nm');const nm=(el?el.value:UI.name).trim().slice(0,8);newGame(UI.sel,nm,mb);save();render(true);},
  pick(v){const i=S.picks.indexOf(v);if(i>=0)S.picks.splice(i,1);else if(S.picks.length<3)S.picks.push(v);
    const app=document.getElementById('app'),sl=app.querySelector('.slots');if(!sl){render();return;}
    sl.innerHTML=slotsHtml();
    app.querySelectorAll('.actc').forEach(b=>{const on=S.picks.includes(b.dataset.v);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.disabled=S.picks.length>=3&&!on;});
    const go=app.querySelector('[data-a="go"]');if(go)go.disabled=S.picks.length<3;},
  go(){if(S.picks.length<3)return;runPlan();save();render(true);},
  burn(){runBurn();save();render(true);},
  choose(v){choose(+v);save();render(true);},
  next(){next();save();render(true);},
  nextyear(){nextYear();save();render(true);},
  fnext(){const f=S.fin;if(S.fp<f.pages.length-1)S.fp++;else S.phase='ending';save();render(true);},
  fchoose(v){const f=S.fin,p=f.pages[S.fp];
    if(p==='contract')f.note=+v===0?'임금과 근로 시간, 휴일을 확인하고 서명했다. 계약서 한 부는 내가 보관한다.':'서명하려는 순간 선생님 말이 떠올랐다. "계약서는 꼭 읽고, 한 부는 네가 가지고 있어야 해." 처음부터 다시 읽고 서명했다.';
    else{f.fb=+v;f.note='다음 걸음을 정했다. 정하고 나니 마음이 조금 가벼워졌다.';}
    S.fp++;save();render(true);},
  modal(v){UI.modal=v;render();const b=document.querySelector('[data-k="m-close"]');if(b)b.focus();},
  closemodal(){const m=UI.modal;UI.modal=null;render();const b=document.querySelector('[data-k="m-'+m+'"]');if(b)b.focus();},
  copy(){const txt=summaryText();const done=ok=>{UI.copy=ok?'ok':'fail';render();if(!ok){const b=document.getElementById('copybox');if(b){b.focus();b.select();}}};
    try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false));}catch(e){done(false);}},
  again(){clearSave();S=null;UI.copy='';UI.name='';UI.screen='char';render(true);}
};
document.getElementById('app').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(b.dataset.a==='closemodal'&&b.classList.contains('scrim')&&e.target!==b)return;
  const fn=H[b.dataset.a];if(fn)fn(b.dataset.v);
});
document.getElementById('app').addEventListener('input',e=>{if(e.target.id==='nm'){UI.name=e.target.value;const t=mbType(),b=document.querySelector('[data-k="start"]');if(t&&b)b.textContent=t+' '+(UI.name.trim()||CHARS[UI.sel].name)+'(으)로 입학한다';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.modal)H.closemodal();});

function boot(data){
  if(data&&data.S){S=data.S;UI.screen=data.screen||'game';}
  render(true);
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S,screen:UI.screen}));}catch(e){}
try{
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
  else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}catch(e){boot({});}
})();
</script>
</body>
</html>
